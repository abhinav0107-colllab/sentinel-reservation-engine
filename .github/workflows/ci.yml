name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit + integration tests. Testcontainers starts PostgreSQL; Kafka runs embedded in the JVM.
      - name: mvn verify
        run: mvn -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  sql-concurrency-check:
    # Database-level proof that the reservation SQL cannot oversell, with a negative control.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinel_check
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]"
      - run: python tools/sql_concurrency_check.py --dsn postgresql://postgres:ci-only-password@localhost:5432/sentinel_check --out reports/sql-concurrency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-concurrency-report
          path: reports/

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinel-reservation-engine:${{ github.sha }} .
